{% extends "base.html" %}

{% block content %}
<main class="container">
    <div class="row">
        <div class="col-md-4 offset-md-4">
            <form action="/tasks/create/" method="POST" class="card card-body mt-5">
                <h1>Create Task</h1>
                {% csrf_token %}
                {{error}}
                <!--Creamos un formulario personalizado que importamos desde forms.py-->
                {{form.as_p}}
                <button class="btn btn-primary">
                    Save
                </button>
            </form>
        </div>
    </div>

</main>
{% endblock %}
